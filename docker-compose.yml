name: cara

# CARA stack.
#
# Single network (proxy-net) for all services.
# Originally split into cara-net (internal) + proxy-net (external) but Docker
# daemon 20.10.5 on this host does not support multi-network in a single
# container create, which Compose v5 requires. See CLAUDE.md "Manutenzione
# 2026-04-30 / Container compose: workaround multi-network".
# Postgres/Redis/MinIO do NOT publish ports — they remain unreachable
# from outside the docker bridge. The shared network is functional, not a
# security boundary.
#
# Profiles:
#   default profile: postgres, redis, minio          (infrastructure only)
#   profile "app":   backend, celery, frontend       (application code)
#
# Usage:
#   docker compose up -d                 # infra only
#   docker compose --profile app up -d   # full stack

x-app-env: &app-env
  env_file: .env

services:
  postgres:
    image: cara-postgres-pgvector:16-0.8.0
    container_name: cara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cara-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - ./data/redis:/data
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: cara-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - ./data/minio:/data
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    <<: *app-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cara-backend:0.1.0
    container_name: cara-backend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      minio:    {condition: service_healthy}
    # NPU access: librkllmrt opens /dev/dri/card0 (DRM ioctl, video group).
    # Verified by tracing the POC: no /dev/rknpu node on this kernel; access
    # routes through DRM. The container needs the device + the video group.
    devices:
      - /dev/dri/card0:/dev/dri/card0
    group_add:
      - "44"                            # video group GID on host
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/models:/app/models:ro
      - ./data/tts:/app/tts                      # Piper voice ONNX files (auto-downloaded)
      - ./data/whisper-cache:/app/whisper-cache  # Whisper STT model cache
      - ./data/kv_cache:/app/cache/kv            # RKLLM KV cache (TTFT savings across restarts)
      - /home/apedo/cara-poc-rkllm/runtime-v1.1.1/librkllmrt.so:/usr/lib/rkllm/librkllmrt.so:ro
      - /var/run/docker.sock:/var/run/docker.sock  # /wall/services + watchdog
    environment:
      LD_LIBRARY_PATH: /usr/lib/rkllm
      LLM_MODEL_PATH: /app/models/qwen2.5-1.5b-instruct-w8a8.rkllm
      LLM_RUNTIME_LIB_PATH: /usr/lib/rkllm/librkllmrt.so
      TTS_VOICES_DIR: /app/tts/piper/voices
      # NB: tested UVICORN_WORKERS=2 on 2026-05-01 — both workers loaded fine
      # (2× 1.5B fits in ~3 GB NPU memory) but throughput per session DROPPED
      # from 9 to 3-4 tok/s with TTFT 3s vs 0.3s, even on a single in-flight
      # request: the two loaded models contend for NPU memory bandwidth even
      # when only one is active. Net: 1 worker + asyncio queue is better UX
      # for a family of 2-3 people. Bumping to 2 only makes sense with a much
      # smaller model (e.g. 0.5B).
      UVICORN_WORKERS: "1"
    networks:
      proxy-net:
        ipv4_address: 172.31.0.21
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s            # 2 worker × ~10s di model load

  # ─── Celery agents ──────────────────────────────────────────────
  # Replaced the single legacy `celery` worker with three queue-bound
  # workers + one beat scheduler. Each worker is concurrency=1 to stay
  # within the NanoPC RAM budget; combined extra footprint ≈ 1 GB.
  # Workers share the same image as `backend` — no LLM init (`LLM_ENABLED=false`).

  celery-beat:
    <<: *app-env
    image: cara-backend:0.1.0
    container_name: cara-celery-beat
    restart: unless-stopped
    profiles: ["app"]
    command: ["celery", "-A", "cara.tasks.celery_app", "beat",
              "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    environment:
      LLM_ENABLED: "false"
    # Worker doesn't serve HTTP — drop the inherited backend healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "celery -A cara.tasks.celery_app inspect ping -d celery@$$(hostname) 2>/dev/null || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 1
    networks:
      proxy-net:
        ipv4_address: 172.31.0.25

  celery-mail:
    <<: *app-env
    image: cara-backend:0.1.0
    container_name: cara-celery-mail
    restart: unless-stopped
    profiles: ["app"]
    command: ["celery", "-A", "cara.tasks.celery_app", "worker",
              "--loglevel=info", "--queues=mail", "--concurrency=1",
              "--hostname=mail@%h"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    environment:
      LLM_ENABLED: "false"
    # Worker doesn't serve HTTP — drop the inherited backend healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "celery -A cara.tasks.celery_app inspect ping -d celery@$$(hostname) 2>/dev/null || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 1
    networks:
      proxy-net:
        ipv4_address: 172.31.0.26

  celery-files:
    <<: *app-env
    image: cara-backend:0.1.0
    container_name: cara-celery-files
    restart: unless-stopped
    profiles: ["app"]
    command: ["celery", "-A", "cara.tasks.celery_app", "worker",
              "--loglevel=info", "--queues=files", "--concurrency=1",
              "--hostname=files@%h"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    volumes:
      - ./data/uploads:/app/uploads
    environment:
      LLM_ENABLED: "false"
    # Worker doesn't serve HTTP — drop the inherited backend healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "celery -A cara.tasks.celery_app inspect ping -d celery@$$(hostname) 2>/dev/null || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 1
    networks:
      proxy-net:
        ipv4_address: 172.31.0.27

  celery-learn:
    <<: *app-env
    image: cara-backend:0.1.0
    container_name: cara-celery-learn
    restart: unless-stopped
    profiles: ["app"]
    command: ["celery", "-A", "cara.tasks.celery_app", "worker",
              "--loglevel=info", "--queues=learn,default", "--concurrency=1",
              "--hostname=learn@%h"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # watchdog auto-recovery
    environment:
      LLM_ENABLED: "false"
    # Worker doesn't serve HTTP — drop the inherited backend healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "celery -A cara.tasks.celery_app inspect ping -d celery@$$(hostname) 2>/dev/null || exit 0"]
      interval: 60s
      timeout: 10s
      retries: 1
    networks:
      proxy-net:
        ipv4_address: 172.31.0.28

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cara-frontend:0.1.0
    container_name: cara-frontend
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      - backend
    networks:
      proxy-net:
        ipv4_address: 172.31.0.20
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PWA v2 — deploy in parallelo a v1 per migrazione graduale.
  # Esposta su :8456 via nginx-proxy (vs :8455 per v1).
  frontend-v2:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    image: cara-frontend-v2:0.1.0
    container_name: cara-frontend-v2
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      - backend
    networks:
      proxy-net:
        ipv4_address: 172.31.0.29
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy-net:
    name: proxy-net
    external: true
