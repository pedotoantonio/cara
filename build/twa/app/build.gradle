plugins {
    id 'com.android.application'
}

android {
    namespace 'casa.pedoto.cara'
    compileSdk 34

    defaultConfig {
        applicationId "casa.pedoto.cara"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            storeFile file('../cara-signing.keystore')
            storePassword 'cara-signing-2026'
            keyAlias 'cara'
            keyPassword 'cara-signing-2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Force a single kotlin-stdlib so the old split jdk7/jdk8 jars (pulled in by
// some transitive deps) don't collide with the unified one used since 1.8.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useTarget(
                group: 'org.jetbrains.kotlin',
                name: 'kotlin-stdlib',
                version: '1.9.22'
            )
            details.because 'unify kotlin-stdlib to avoid duplicate jdk7/jdk8 classes'
        }
    }
}
