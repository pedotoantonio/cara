# nginx config inside cara-frontend-v2 container.
# Serves the React PWA v2 static build + reverse-proxies /api/* to
# cara-backend on proxy-net. Same pattern del v1 ma con cache-control
# rinforzato per evitare "white page after rebuild" su Chrome.

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 100M;

  # ----- API + WebSocket → FastAPI cara-backend -----
  location ^~ /api/ {
    proxy_pass http://cara-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location = /health {
    proxy_pass http://cara-backend:8000/health;
  }

  # ----- PWA control-plane: niente cache long-term -----
  # Bug noto v1: SW vecchio serve index.html stale che referenzia JS hashed
  # spariti → 404 → white page. Cache-Control aggressivo qui.
  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files /index.html =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache, must-revalidate";
    expires off;
    try_files $uri =404;
  }

  # ----- Assets hashed: cache aggressive -----
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    expires 1y;
    try_files $uri =404;
  }
  location /icons/ {
    add_header Cache-Control "public, max-age=2592000";
    expires 30d;
    try_files $uri =404;
  }
  location ~* \.(svg|ico|png|webp|jpg|jpeg|gif|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
    expires 30d;
    try_files $uri =404;
  }

  # ----- SPA fallback -----
  location / {
    try_files $uri $uri/ /index.html;
  }
}
