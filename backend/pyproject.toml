[project]
name = "cara"
version = "0.1.0"
description = "CARA - Casa AI for Routines & Activities (backend)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Antonio Pedoto" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "structlog>=24.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.1",                  # passlib 1.7.x is incompatible with bcrypt>=4.1 (uses removed __about__)
  "email-validator>=2.0",
  "python-telegram-bot>=21.0",
  "feedparser>=6.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "piper-tts>=1.2",              # MIT, italian-native TTS (Paola, Riccardo)
  "trafilatura>=1.12",            # Apache 2.0, article extraction for the CDA
  "faster-whisper>=1.0",          # MIT, server-side STT fallback (aarch64 wheels OK)
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "types-passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cara"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "C4", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
