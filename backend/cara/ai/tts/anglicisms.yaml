# Italian TTS pronunciation overrides for English / loanword vocabulary.
#
# The Piper voice `it_IT-paola-medium` reads "weekend" as "uéendi" because
# the Italian grapheme-to-phoneme has no concept of English borrowings.
# Pre-processing the text with these substitutions before TTS gives a
# pronunciation that sounds natural to an Italian listener, without
# needing a second voice or code-switching infrastructure.
#
# Format: <english_word>: <italian_phonetic_spelling>
# Match is case-insensitive on word boundaries (\b...\b).
# The spelling on the right is what Piper IT will read — choose it so
# the resulting Italian phonemes approximate English pronunciation.
#
# Curation principles:
#   1. Only loanwords genuinely used in Italian everyday speech.
#   2. The substitution must produce a pronunciation closer to the
#      original than the default Italian reading. Test by ear.
#   3. If a word already sounds OK in default Italian (e.g. "bar",
#      "sport"), leave it out. Less is more.
#   4. Stress (acute/grave accent) on the syllable Italians naturally
#      stress when speaking the loanword.
#
# Admin can override or add entries via the admin panel (Step 1.2). User
# overrides win over this base dictionary. Entries here are conservative
# defaults — feel free to tune by ear once the family hears CARA speak.

