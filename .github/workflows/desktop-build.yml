name: desktop · build

# Build the CARA native desktop wrapper (Tauri 2) for Windows + Linux.
# Runs on push to main when anything under apps/desktop changes, and on
# manual dispatch. On tags `desktop-v*` it also drafts a Release with the
# installers attached so the family can grab the latest .msi / .AppImage
# without touching CI.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-build.yml"
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm cache: only 2 small dev deps, and we don't commit a
          # lockfile yet (Tauri CLI versions move fast; we want each
          # build to pick up the latest 2.x). The heavy cache is the
          # Rust target dir, handled by swatinem/rust-cache below.

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Cache key includes the target so Windows + Linux don't collide.
          shared-key: ${{ matrix.label }}

      - name: npm install
        run: npm install

      - name: Generate icons from source PNG
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/icon.png

      - name: Build (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect Linux artefacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ../../dist-${{ matrix.label }}
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            \( -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} ../../dist-${{ matrix.label }}/ \;
          ls -la ../../dist-${{ matrix.label }}/

      - name: Collect Windows artefacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p ../../dist-${{ matrix.label }}
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -name "*.msi" \
            -exec cp {} ../../dist-${{ matrix.label }}/ \;
          ls -la ../../dist-${{ matrix.label }}/

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cara-desktop-${{ matrix.label }}
          path: dist-${{ matrix.label }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "CARA Desktop ${{ github.ref_name }}"
          draft: true
          files: |
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.msi
