# nginx config inside the cara-frontend container.
# Serves the React PWA static build and reverse-proxies /api/* to the backend
# container on cara-net (DNS name "backend" via compose alias, or "cara-backend"
# via container_name).

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 100M;

  # API + WebSocket → FastAPI
  location /api/ {
    proxy_pass http://cara-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Direct /health passthrough (handy for monitoring)
  location = /health {
    proxy_pass http://cara-backend:8000/health;
  }

  # PWA control plane — these MUST never be long-cached, otherwise after a
  # frontend rebuild the browser keeps the old service worker which caches
  # the old index.html which references hashed JS bundles that no longer
  # exist (404). Result: white page on Chrome until the user manually
  # clears site data. Keep updates fast and quiet.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }
  location = /sw.js.map {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    # Force the spec MIME so PWA validators don't flag octet-stream.
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache, must-revalidate";
    expires off;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    expires off;
    try_files $uri =404;
  }

  # Hashed assets under /assets/<name>-<hash>.<ext>: safe to cache forever
  # because Vite includes a content hash in the filename. Different content
  # → different filename → no stale cache problem.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Other static assets at the root (favicon, icons, fonts).
  location ~* \.(woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # SPA fallback — all unknown routes serve index.html with no-cache so
  # the browser always picks up the latest hashed bundle reference.
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires off;
    try_files $uri $uri/ /index.html;
  }
}
