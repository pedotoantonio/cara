# nginx config inside the cara-frontend container.
# Serves the React PWA static build and reverse-proxies /api/* to the backend
# container on cara-net (DNS name "backend" via compose alias, or "cara-backend"
# via container_name).

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 100M;

  # API + WebSocket → FastAPI
  location /api/ {
    proxy_pass http://cara-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  # Direct /health passthrough (handy for monitoring)
  location = /health {
    proxy_pass http://cara-backend:8000/health;
  }

  # SPA fallback — all unknown routes serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets: cache aggressively (filenames are hashed by Vite)
  location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
